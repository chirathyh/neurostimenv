defaults:
  - ballnstick_field_controllability
  - _self_

# Cheap replication of the broad one-seed screen on two disjoint seeds. This
# is still exploratory; it tests whether the leading AC and DC responses recur.
actions:
  - {id: sham, montage: axial, dc_offset_v_per_m: 0.0, ac_amplitude_v_per_m: 0.0, frequency_hz: 0.0, phase_rad: 0.0, include_in_subspace: false}
  - {id: axial_ac_0p8_10hz_p90, montage: axial, dc_offset_v_per_m: 0.0, ac_amplitude_v_per_m: 0.8, frequency_hz: 10.0, phase_rad: 1.5707963267948966, include_in_subspace: true}
  - {id: axial_ac_0p8_40hz_p0, montage: axial, dc_offset_v_per_m: 0.0, ac_amplitude_v_per_m: 0.8, frequency_hz: 40.0, phase_rad: 0.0, include_in_subspace: true}
  - {id: axial_dc_m0p8, montage: axial, dc_offset_v_per_m: -0.8, ac_amplitude_v_per_m: 0.0, frequency_hz: 0.0, phase_rad: 0.0, include_in_subspace: true}
  - {id: axial_dc_p0p5, montage: axial, dc_offset_v_per_m: 0.5, ac_amplitude_v_per_m: 0.0, frequency_hz: 0.0, phase_rad: 0.0, include_in_subspace: true}
  - {id: transverse_dc_p0p8, montage: transverse_x, dc_offset_v_per_m: 0.8, ac_amplitude_v_per_m: 0.0, frequency_hz: 0.0, phase_rad: 0.0, include_in_subspace: false}

discovery:
  n_seeds: 2
  seed_offset: 83000
  top_k: 2

validation:
  n_seeds: 0
  seed_offset: 84000
