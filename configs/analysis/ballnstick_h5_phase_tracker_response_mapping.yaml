states:
  # P2A selected q=1.0 to isolate biological process noise from sensor noise.
  shared_drive_levels:
    - label: full_shared_drive
      shared_modulated_fraction: 1.0

timeline:
  burn_in_steps: 1
  baseline_steps: 30
  stimulation_steps: 8
  washout_steps: 1
  block_ramp_ms: 0.0
  stimulation_analysis_trim_ms: 0.0

crossed_design:
  n_structure_seeds: 6
  n_history_seeds: 1
  n_future_continuations: 4
  structure_seed_offset: 420000
  history_seed_offset: 630000
  phase_seed_offset: 640000
  trial_seed_offset: 650000
  future_seed_offset: 660000

observation_noise:
  enabled: true
  # Overridden per crossed context, but retained here as the low-noise anchor.
  rms_fraction_of_baseline_neural_eeg: 0.25
  ar1_coefficient: 0.95
  seed_offset: 700000

measurement_conditions:
  - label: low_observation_noise
    rms_fraction_of_baseline_neural_eeg: 0.25
  - label: high_observation_noise
    rms_fraction_of_baseline_neural_eeg: 0.50

actions:
  amplitude_v_per_m: 0.2
  controller_modes:
    - sham
    - refresh_1000ms_250ms
    - refresh_500ms_125ms

response_mapping:
  frozen_estimator: multitaper_pooled_evidence
  safe_abstention_action: sham
  h4_reference_profile: refresh_500ms_125ms
  conservative_profile: refresh_1000ms_250ms
  responsive_profile: refresh_500ms_125ms
  practical_context_margin_log10: 0.01
  predecision_tracker_diagnostic_tail_s: 8.0
  predecision_common_interval_ms: 125.0
  association_permutations: 10000
  association_fdr_alpha: 0.10
  association_seed_offset: 750000

criteria:
  minimum_screened_contexts: 48
  minimum_eligible_contexts: 36
  minimum_structure_seeds: 6
  minimum_future_continuations: 4
  minimum_carrier_identification_coverage_each_noise: 0.80
  minimum_accepted_carrier_accuracy_each_noise: 0.90
  minimum_target_corner_contexts: 8
  minimum_contexts_per_optimal_profile: 4
  minimum_structures_per_optimal_profile: 3
  minimum_practical_contexts_per_profile: 3
  minimum_practical_structures_per_profile: 2
  minimum_fast_advantage_high_diffusion_low_noise_log10: 0.01
  minimum_slow_advantage_low_diffusion_high_noise_log10: 0.01
  minimum_response_crossover_log10: 0.02
  minimum_target_direction_structure_fraction: 0.6666666666666666
  minimum_realized_winner_agreement_fraction: 0.75
  minimum_oracle_advantage_over_best_fixed_log10: 0.01
  minimum_positive_structure_oracle_fraction: 0.6666666666666666
  minimum_phase_response_spearman: 0.30
  minimum_response_feature_abs_spearman: 0.30
  maximum_response_feature_fdr_q: 0.10
  minimum_response_feature_structure_sign_fraction: 0.6666666666666666
  maximum_baseline_relative_rms_error: 1.0e-8
  maximum_causal_timing_error_ms: 1.0e-9
  maximum_field_boundary_discontinuity_v_per_m: 1.0e-10
  maximum_frequency_correction_hz: 2.000000001
  minimum_common_phase_estimate_actionable_fraction: 0.80
  maximum_washout_residual_fraction: 0.50
  maximum_washout_absolute_log10: 1.0e-6

