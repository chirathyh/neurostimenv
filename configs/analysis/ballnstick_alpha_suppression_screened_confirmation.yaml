# Confirmation of the frozen 0.4-V/m protocol in a prospectively defined
# elevated-alpha, phase-actionable toy subgroup. Candidate eligibility is
# determined before active simulation and never uses a tACS outcome or the
# seed-specific B counterfactual.
simulator: online
inhibition_scale: 1.0
maximum_field_v_per_m: 0.8

timeline:
  burn_in_steps: 1
  baseline_steps: 4
  stimulation_steps: 6
  washout_steps: 2
  block_ramp_ms: 500.0
  stimulation_analysis_trim_ms: 500.0

frozen_candidate:
  result_dir: ../../results/ballnstick_alpha_suppression_dose_audit/alpha_suppression_dose_audit
  expected_modulation_depth: 0.04
  expected_frequency_hz: 10.0
  expected_amplitude_v_per_m: 0.4
  expected_relative_phase_offset_rad: 3.141592653589793
  expected_montage: axial

screening:
  # The first eight eligible seeds are enrolled from this fixed prospective
  # sequence. Twenty candidates allow exclusions without changing the rule.
  target_enrolled_seeds: 8
  maximum_candidate_seeds: 20
  seed_offset: 190000

reference:
  frequency_hz: ${analysis.frozen_candidate.expected_frequency_hz}
  phase_rad: 0.0
  populations: [E, I]
  thinning_envelope_modulation_depth: 0.16

tacs:
  frequency_hz: ${analysis.frozen_candidate.expected_frequency_hz}
  amplitude_v_per_m: ${analysis.frozen_candidate.expected_amplitude_v_per_m}
  axial_montage: axial
  transverse_montage: transverse_x

protocol:
  axial_montage: ${analysis.tacs.axial_montage}
  transverse_montage: ${analysis.tacs.transverse_montage}
  amplitude_v_per_m: ${analysis.tacs.amplitude_v_per_m}
  frequency_hz: ${analysis.tacs.frequency_hz}
  phase_rad: ${analysis.frozen_candidate.expected_relative_phase_offset_rad}
  block_ramp_ms: ${analysis.timeline.block_ramp_ms}

target_fs_hz: 500
low_hz: 0.5
high_hz: 100.0
alpha_low_hz: 8.0
alpha_high_hz: 12.0
stimulus_exclusion_half_width_hz: 2.0

phase_null:
  n_surrogates: 500

phase_quality:
  maximum_split_half_error_deg: 45.0
  minimum_10hz_resultant_to_rms: 0.05

criteria:
  minimum_positive_seeds: 6
  maximum_primary_p_value: 0.05
  minimum_B_classification_accuracy: 0.75
  minimum_rate_safe_fraction: 1.0
  minimum_field_removal_fraction: 0.75
  maximum_washout_residual_fraction: 0.50
  maximum_washout_absolute_log10: 1.0e-6
  maximum_baseline_relative_rms_error: 1.0e-8

rate_guardrails_hz:
  E_min: 0.1
  E_max: 30.0
  I_min: 0.1
  I_max: 60.0
rate_reference_tolerance_fraction: 0.20

n_bootstrap: 5000
save_raw_eeg: false
save_spikes: false
