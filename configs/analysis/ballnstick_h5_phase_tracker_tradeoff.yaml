timeline:
  burn_in_steps: 1
  # One persistent, stimulation-free baseline contains the frozen 30-s
  # carrier/context record followed by an independent-in-time 8-s tracker
  # evaluation tail. Compatibility stimulation/washout epochs remain sham.
  baseline_steps: 38
  stimulation_steps: 1
  washout_steps: 1
  block_ramp_ms: 0.0
  stimulation_analysis_trim_ms: 0.0

crossed_design:
  n_structure_seeds: 6
  n_history_seeds: 1
  structure_seed_offset: 410000
  history_seed_offset: 550000
  phase_seed_offset: 560000
  trial_seed_offset: 570000
  noise_seed_offset: 620000

states:
  # Shared drive is fixed at one to isolate phase process noise from
  # observation noise. Partial drive becomes a later robustness condition.
  shared_drive_levels:
    - label: full_shared_drive
      shared_modulated_fraction: 1.0

phase_tracker_tradeoff:
  frozen_estimator: multitaper_pooled_evidence
  predecision_duration_s: 30.0
  evaluation_duration_s: 8.0
  observation_noise_fractions: [0.25, 0.50, 0.75]
  fixed_low_noise_fraction: 0.25
  candidate_high_noise_fractions: [0.50, 0.75]
  ar1_coefficient: 0.95
  common_audit_interval_ms: 125.0
  latent_transfer_calibration_history_ms: 1000.0
  latent_transfer_calibration_interval_ms: 250.0
  phase_actionability_resultant_to_rms: 0.03
  tracker_profiles:
    refresh_1000ms_250ms:
      history_ms: 1000.0
      update_interval_ms: 250.0
    refresh_500ms_125ms:
      history_ms: 500.0
      update_interval_ms: 125.0
  selection_preference: smallest_passing_high_noise_fraction

criteria:
  minimum_independent_structures: 6
  minimum_contexts: 24
  minimum_carrier_coverage_each_selected_noise: 0.80
  minimum_accepted_carrier_accuracy_each_selected_noise: 0.90
  minimum_tracker_actionable_fraction: 0.80
  minimum_latent_transfer_coherence: 0.50
  minimum_fast_advantage_high_diffusion_low_noise_rad: 0.02
  minimum_slow_advantage_low_diffusion_high_noise_rad: 0.02
  minimum_crossover_contrast_rad: 0.05
  minimum_directional_structure_fraction: 0.6666666666666666
  minimum_rate_safe_fraction: 1.0

save_processed_eeg: false
save_raw_eeg: false
save_spikes: false
