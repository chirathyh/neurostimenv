# H5-P2A is a stimulation-free measurement/control-design study. It asks
# whether biological phase diffusion and observation uncertainty create the
# predeclared slow-versus-fast phase-tracker bias--variance crossover required
# before another active H5 response-mapping experiment is justified.
smoke_test: false
smoke_context_limit: 0

