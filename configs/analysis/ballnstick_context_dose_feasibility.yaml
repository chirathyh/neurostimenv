# CL0: low-cost crossed-seed, full-information feasibility gate for a later
# EEG-contextual amplitude bandit. This experiment does not fit or confirm RL.
simulator: online
inhibition_scale: 1.0
maximum_field_v_per_m: 0.8

timeline:
  burn_in_steps: 1
  baseline_steps: 4
  stimulation_steps: 6
  washout_steps: 2
  block_ramp_ms: 500.0
  stimulation_analysis_trim_ms: 500.0

frozen_candidate:
  result_dir: ../../results/ballnstick_alpha_suppression_dose_audit/alpha_suppression_dose_audit
  expected_modulation_depth: 0.04
  expected_frequency_hz: 10.0
  expected_amplitude_v_per_m: 0.4
  expected_relative_phase_offset_rad: 3.141592653589793
  expected_montage: axial

crossed_design:
  # Three by three is directional system identification, not powered
  # confirmation. Structure is the statistical grouping variable.
  n_structure_seeds: 3
  n_drive_seeds: 3
  structure_seed_offset: 200000
  drive_seed_offset: 210000
  # Hold absolute input phase fixed so the drive factor isolates event timing.
  fixed_phase_seed_offset: 220000
  # Analysis/surrogate identity only; it does not construct the network.
  trial_seed_offset: 230000

actions:
  # Frequency, phase policy and montage remain frozen. Only amplitude varies.
  active_doses_v_per_m: [0.2, 0.4]
  low_dose_v_per_m: 0.2
  fixed_comparator_v_per_m: 0.4

reference:
  frequency_hz: 10.0
  phase_rad: 0.0
  populations: [E, I]
  thinning_envelope_modulation_depth: 0.16

tacs:
  frequency_hz: 10.0
  axial_montage: axial
  transverse_montage: transverse_x

protocol:
  axial_montage: ${analysis.tacs.axial_montage}
  transverse_montage: ${analysis.tacs.transverse_montage}
  amplitude_v_per_m: ${analysis.actions.fixed_comparator_v_per_m}
  frequency_hz: ${analysis.tacs.frequency_hz}
  phase_rad: 3.141592653589793
  block_ramp_ms: ${analysis.timeline.block_ramp_ms}

target_fs_hz: 500
low_hz: 0.5
high_hz: 100.0
alpha_low_hz: 8.0
alpha_high_hz: 12.0
stimulus_exclusion_half_width_hz: 2.0

phase_null:
  n_surrogates: 200

phase_quality:
  maximum_split_half_error_deg: 45.0
  minimum_10hz_resultant_to_rms: 0.05

context_model:
  # Arm-specific ridge regression evaluated only by held-out structure seed.
  ridge_penalty: 1.0

criteria:
  minimum_eligible_contexts: 4
  minimum_eligible_structure_seeds: 3
  minimum_eligible_drive_seeds: 2
  # Approximately a 2.3% power-ratio difference; used only as a directional
  # practical gate, not as a biological or clinical threshold.
  practical_advantage_log10: 0.01
  minimum_mean_oracle_advantage_log10: 0.005
  minimum_practical_nonfixed_contexts: 2
  minimum_contextual_selected_action_count: 2
  minimum_mean_contextual_advantage_log10: 0.0
  minimum_positive_structure_fraction: 0.6666666666666666
  maximum_baseline_relative_rms_error: 1.0e-8
  maximum_washout_residual_fraction: 0.50
  maximum_washout_absolute_log10: 1.0e-6

rate_guardrails_hz:
  E_min: 0.1
  E_max: 30.0
  I_min: 0.1
  I_max: 60.0
rate_reference_tolerance_fraction: 0.20

save_raw_eeg: false
save_spikes: false
