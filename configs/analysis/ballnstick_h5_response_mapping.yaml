timeline:
  burn_in_steps: 1
  # The carrier estimator was confirmed only for a complete 30-s baseline.
  baseline_steps: 30
  # Preserve the duration-matched H4 neural-EEG endpoint.
  stimulation_steps: 8
  washout_steps: 1
  block_ramp_ms: 0.0
  stimulation_analysis_trim_ms: 0.0

crossed_design:
  # Six independent structures provide an exploratory response map. Frequency,
  # diffusion, shared-drive fraction, and futures are repeated conditions.
  n_structure_seeds: 6
  n_history_seeds: 1
  n_future_continuations: 4
  structure_seed_offset: 402000
  history_seed_offset: 500000
  phase_seed_offset: 510000
  trial_seed_offset: 520000
  future_seed_offset: 530000

observation_noise:
  enabled: true
  rms_fraction_of_baseline_neural_eeg: 0.25
  ar1_coefficient: 0.95
  seed_offset: 600000

actions:
