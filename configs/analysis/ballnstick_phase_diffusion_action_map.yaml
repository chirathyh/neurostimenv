# D1: exploratory full-information action mapping after the disjoint D0b EEG
# observability confirmation. This experiment does not train a bandit.
simulator: online
inhibition_scale: 1.0
maximum_field_v_per_m: 0.8
smoke_test: false
smoke_context_limit: 0

timeline:
  burn_in_steps: 1
  # The frozen D0b C1 observation requires twelve stimulation-free seconds.
  baseline_steps: 12
  # Three seconds with 0.5-s ramps leaves two seconds for the acute endpoint.
  stimulation_steps: 3
  washout_steps: 2
  block_ramp_ms: 500.0
  stimulation_analysis_trim_ms: 500.0

source_d0b:
  result_dir: ../../results/ballnstick_phase_increment_confirmation_full/phase_increment_confirmation
  expected_sha256:
    conclusion: 806c6fa40a65197f15eb1aba2e6d6845f636cc4f8a4bd497c3e93e9d9b1c5b07
    provenance: 7212e933d30639c072d7634711ea44cdb97896351782aa83b7dcf466f9b83b7e
    metrics: c028dda887c125fec87d47a5d84598d4e17bde779c6a03f77c13a9c0ae521e16

source_f0:
  result_dir: ../../results/ballnstick_frequency_phase_feasibility_full/frequency_phase_feasibility
  expected_sha256:
    conclusion: cd401bdc09ff66559937e94a40cdc8e42210f4543fd9910a2009a5f9c1fe7d89
    provenance: 0722582464fae499aa54c9c8aeba91cd926eb6bc263fb67de2185ab81af83738
    metrics: be5270a4b4a48307299011f6b0a3f2ae1de58487d830e5527bd12fd5b1e48157
    calibration: 764716344b5a84f6fc921595a51b1f95d0c9e44c9248274cb3f6e4f52d69dc6e

reference_calibration:
  # Homogeneous-Poisson B reference seeds are disjoint from D0, D0b, F0,
  # phase-diffusion contexts, and every postdecision future.
  n_seeds: 6
  seed_offset: 422000
  upper_quantile: 0.95
  minimum_scale_log10: 0.05

states:
  modulation_depth: 0.04
  frequencies_hz: [9.0, 11.0]
  phase_diffusion_levels:
    - {label: low_diffusion, diffusion_rad2_per_s: 0.5}
    - {label: high_diffusion, diffusion_rad2_per_s: 2.0}
  phase_diffusion_integration_dt_ms: 1.0

crossed_design:
  # This is a directional feasibility map. Structure is the independent unit;
  # frequency, diffusion level, and future are repeated measurements.
  n_structure_seeds: 3
  n_history_seeds: 1
  n_future_continuations: 2
  structure_seed_offset: 421000
  history_seed_offset: 440000
  phase_seed_offset: 441000
  trial_seed_offset: 442000
  future_seed_offset: 443000

reference:
  frequency_hz: 9.0
  phase_rad: 0.0
  populations: [E, I]
  thinning_envelope_modulation_depth: 0.16

actions:
  # Sham is a causal comparator and is also allowed as an abstention action.
  sham_dose_v_per_m: 0.0
  active_doses_v_per_m: [0.2, 0.4]

tacs:
  frequency_hz: 9.0
  relative_phase_offset_rad: 3.141592653589793
  axial_montage: axial
  # Phase is initialized from the last causal one-second EEG window, whereas
  # C1 is estimated from the complete twelve-second predecision history.
  phase_estimation_steps: 1

protocol:
  axial_montage: ${analysis.tacs.axial_montage}
  transverse_montage: transverse_x
  amplitude_v_per_m: 0.4
  frequency_hz: ${analysis.tacs.frequency_hz}
  phase_rad: 0.0
  block_ramp_ms: ${analysis.timeline.block_ramp_ms}

measurement:
  phase_window_s: 1.0
  temporal_chunk_s: 4.0
  spectral_core_half_width_hz: 0.25
  spectral_neighbourhood_half_width_hz: 1.5

spectral_target:
  candidate_frequencies_hz: [9.0, 11.0]
  band_half_width_hz: 0.75

screening:
  # Eligibility uses only the predecision ideal EEG and population B target.
  minimum_alpha_excess_log10: 0.05
  minimum_recent_resultant_to_rms: 0.03

context:
  # C1 is the only learnable D1 policy feature. Carrier and recent phase are
  # deterministic signal-processing inputs to the matched tACS protocol.
  policy_features: [context_C1]
  ridge_penalty: 1.0e-3

criteria:
  minimum_reference_seeds: 6
  minimum_eligible_contexts: 6
  minimum_structure_seeds: 3
  minimum_future_continuations: 2
  minimum_frequency_detection_accuracy: 0.80
  minimum_diffusion_levels_enrolled: 2
  minimum_frequencies_enrolled: 2
  maximum_baseline_relative_rms_error: 1.0e-8
  maximum_phase_tracking_error_rad: 1.0e-10
  practical_action_advantage_log10: 0.01
  minimum_nonfixed_contexts: 2
  minimum_nonfixed_structures: 2
  minimum_expected_action_count: 2
  minimum_active_action_count: 1
  minimum_mean_oracle_advantage_log10: 0.005
  minimum_mean_absolute_diffusion_dose_interaction_log10: 0.005
  minimum_realized_winner_agreement_fraction: 0.75
  minimum_policy_advantage_over_best_fixed_log10: 0.0
  minimum_positive_structure_fraction: 0.6666666666666666
  maximum_context_shuffle_p_value: 0.20
  maximum_washout_residual_fraction: 0.50
  maximum_washout_absolute_log10: 1.0e-6

context_shuffle:
  n_permutations: 1000
  random_seed_offset: 444000

rate_guardrails_hz:
  E_min: 0.1
  E_max: 30.0
  I_min: 0.1
  I_max: 60.0
rate_reference_tolerance_fraction: 0.20

target_fs_hz: 500
low_hz: 0.5
high_hz: 100.0
alpha_low_hz: 8.0
alpha_high_hz: 12.0
stimulus_exclusion_half_width_hz: 0.75
phase_null:
  n_surrogates: 0

save_raw_eeg: false
save_spikes: false
