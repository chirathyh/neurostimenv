# Confirmation-only test of the protocol generated by the alpha-suppression
# pilot. This configuration contains no calibration or action-selection grid.
# The source JSON files are read and copied into the new result directory.
simulator: online
inhibition_scale: 1.0
maximum_field_v_per_m: 0.8

timeline:
  burn_in_steps: 1
  baseline_steps: 4
  stimulation_steps: 6
  washout_steps: 2
  block_ramp_ms: 500.0
  stimulation_analysis_trim_ms: 500.0

frozen_source:
  result_dir: ../../results/ballnstick_alpha_suppression_pilot/alpha_suppression
  expected_modulation_depth: 0.04
  expected_frequency_hz: 10.0
  expected_amplitude_v_per_m: 0.8
  expected_relative_phase_offset_rad: 3.141592653589793
  expected_montage: axial

# These settings reconstruct A after the modulation depth has been loaded from
# frozen_alpha_target.json. The phase is randomized independently by seed.
reference:
  frequency_hz: ${analysis.frozen_source.expected_frequency_hz}
  phase_rad: 0.0
  populations: [E, I]
  thinning_envelope_modulation_depth: 0.16

validation:
  # Eight new seeds support an exact two-sided sign-flip p-value of 0.0078125
  # when all paired effects share one direction. They are disjoint from the
  # 160001--162004 pilot seeds and remain the statistical units.
  n_seeds: 8
  seed_offset: 170000

tacs:
  frequency_hz: ${analysis.frozen_source.expected_frequency_hz}
  amplitude_v_per_m: ${analysis.frozen_source.expected_amplitude_v_per_m}
  axial_montage: axial
  transverse_montage: transverse_x

# Shared namespace consumed by the persistent online episode utilities. The
# runner replaces these placeholders with the loaded frozen protocol.
protocol:
  axial_montage: ${analysis.tacs.axial_montage}
  transverse_montage: ${analysis.tacs.transverse_montage}
  amplitude_v_per_m: ${analysis.frozen_source.expected_amplitude_v_per_m}
  frequency_hz: ${analysis.frozen_source.expected_frequency_hz}
  phase_rad: ${analysis.frozen_source.expected_relative_phase_offset_rad}
  block_ramp_ms: ${analysis.timeline.block_ramp_ms}

target_fs_hz: 500
low_hz: 0.5
high_hz: 100.0
alpha_low_hz: 8.0
alpha_high_hz: 12.0
stimulus_exclusion_half_width_hz: 2.0

phase_null:
  n_surrogates: 500

phase_quality:
  # Phase is estimated independently from the first and second halves of the
  # four-second baseline and extrapolated to the same action boundary.
  maximum_split_half_error_deg: 45.0
  minimum_10hz_resultant_to_rms: 0.05

criteria:
  minimum_validation_seeds: 8
  minimum_positive_seeds: 6
  maximum_primary_p_value: 0.05
  minimum_reference_classification_accuracy: 0.75
  minimum_two_second_classification_accuracy: 0.65
  minimum_phase_quality_fraction: 0.75
  minimum_rate_safe_fraction: 1.0
  minimum_washout_recovery_fraction: 0.75
  maximum_washout_residual_fraction: 0.50
  maximum_baseline_relative_rms_error: 1.0e-8

rate_guardrails_hz:
  E_min: 0.1
  E_max: 30.0
  I_min: 0.1
  I_max: 60.0
rate_reference_tolerance_fraction: 0.20

n_bootstrap: 5000
save_raw_eeg: false
save_spikes: false
